# Continuous integration — runs on every pull request and every push to main.
#
# Two independent jobs, one per package, so a front-end failure never hides a
# server failure (and vice versa). Neither job needs a database or any secret:
# the test suites stub Mongo, and the production build is self-contained.
#
# See docs/CI_CD.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22" # same major as production

jobs:
  server:
    name: Server — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check (every server module loads)
        run: node --check server.js && for f in routes/*.js utils/*.js models/*.js middleware/*.js; do node --check "$f"; done
      - name: Unit + integration tests
        run: npm test
        env:
          # Tests set their own JWT secret; these keep any accidental real
          # connection or email attempt from going anywhere.
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:1/ci-never-connects
          EMAIL_USER: ""
          SMTP_HOST: ""

  front-end:
    name: Front-end — tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            front-end/package-lock.json
            server/package-lock.json
      - run: npm ci
      # Several front-end suites exercise SERVER code directly — the Data Entry
      # bulk-upload UAT mounts the real Express routes, the workbook test runs
      # server/scripts/generateDevTestWorkbook.js, and the feature-tour test loads
      # VERA's knowledge base (which requires @anthropic-ai/sdk). Without the
      # server's packages those three failed with "Cannot find module 'express'"
      # / '@anthropic-ai/sdk', so this job could never go green.
      - name: Install server dependencies (used by cross-package tests)
        working-directory: server
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (report only)
        # The codebase carries pre-existing lint debt, so lint reports as a
        # warning instead of failing (a red step here read as "CI failed").
        # Make it blocking once the backlog is cleared: drop the `|| …` part
        # (docs/CI_CD.md → "Making lint blocking").
        run: npm run lint || echo "::warning title=Lint::ESLint reported problems (report only — not blocking). Run npm run lint locally for the list."
      - name: Production build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: front-end-dist
          path: front-end/dist
          retention-days: 7
