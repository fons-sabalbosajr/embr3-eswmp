# Continuous deployment — ships main to the Hostinger VPS.
#
# Runs only after CI has passed on main (or when started by hand), connects to
# the VPS over SSH as the app user, and runs scripts/deploy/vps-deploy.sh — the
# same steps as the manual update procedure, with a
# health check and an automatic rollback.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          server IP or hostname
#   VPS_USER          the app user that owns the checkout (never root)
#   VPS_SSH_KEY       private key whose public half is in that user's ~/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS   output of `ssh-keyscan -t ed25519 <VPS_HOST>` (pins the host key)
# Optional:
#   VPS_PORT          SSH port (default 22)
#
# The "production" environment can be given required reviewers so every deploy
# waits for a person to approve it. See docs/CI_CD.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy (default: main)"
        required: false
        default: main

# Never two deploys at once; a queued one waits rather than cancelling a deploy
# that is halfway through restarting the API.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    # Automatic runs only when CI succeeded on a push to main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://embr3-onlinesystems.cloud/eswm-pipeline/
    steps:
      - name: Resolve the commit to deploy
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the commit being deployed (for the deploy script)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Name every missing secret at once. Secrets must be Actions *secrets*
          # (not variables), at repository level or in the "production" environment.
          missing=""
          for s in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — add them under Settings → Secrets and variables → Actions → Secrets (repository), or Settings → Environments → production → Environment secrets."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # A browser text box can save the key with Windows line endings,
          # which OpenSSH rejects as "invalid format" — strip them.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Public fingerprints only — lets you confirm the right key was pasted.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/keyerr; then
            echo "::error::VPS_SSH_KEY is not a valid private key ($(cat /tmp/keyerr)). Paste the whole file, from -----BEGIN to END-----."
            exit 1
          fi
          echo "Deploy key: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          echo "Pinned host: $(ssh-keygen -lf ~/.ssh/known_hosts 2>&1 | head -1)"

      - name: Preflight — SSH login
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if ! ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
                -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'echo "connected as $(id -un)"'; then
            echo "::error::SSH login failed. Check: VPS_HOST/VPS_USER values, that the deploy key's public half is in that user's ~/.ssh/authorized_keys, and that VPS_KNOWN_HOSTS matches the server (ssh-keyscan -t ed25519 <host>)."
            exit 1
          fi

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_REF: ${{ steps.ref.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' bash -s" < scripts/deploy/vps-deploy.sh
        # The script is streamed from this checkout of the repo, so the steps
        # that run are the reviewed ones — not whatever copy sits on the server.

      - name: Public health check
        # The app is served under /eswm-pipeline/ — the bare /api/ path answers
        # 404 over HTTPS, so it would fail every deploy.
        #
        # Run FROM THE VPS, over the deploy SSH connection. The site sits behind
        # Cloudflare, which answers GitHub-hosted runners (cloud datacenter IPs)
        # with HTTP 403 — measured 2026-10-12: six 403s from the runner while
        # the same URL returned 200 from the VPS and from a normal client, after
        # a deploy that had succeeded. Curling the PUBLIC hostname from the VPS
        # still exercises the whole path (DNS → Cloudflare → nginx → app); it
        # just is not subject to Cloudflare's bot rules for datacenter ranges.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          HEALTH_URL: https://embr3-onlinesystems.cloud/eswm-pipeline/api/health
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
                     -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" \
                     "curl -sS -o /dev/null -w '%{http_code}' --max-time 10 '$HEALTH_URL'" || true)
            echo "attempt $i → HTTP $code (from the VPS)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Public health check failed after deploy (checked from the VPS)"
          exit 1

      - name: Public health check from GitHub (informational)
        # Reported, never fatal: a Cloudflare block on GitHub's IP ranges says
        # nothing about whether the deploy worked — the step above does.
        if: always()
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://embr3-onlinesystems.cloud/eswm-pipeline/api/health || true)
          echo "From the GitHub runner → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning title=Public check from GitHub::HTTP $code from the runner (likely Cloudflare blocking GitHub's datacenter IPs). The VPS-side check above is the one that gates the deploy."
          fi
